<!-- html-slides v2.0 | 2026-04 | Minimal Black Editorial Presentation Template -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Presentation Title</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;700;900&amp;family=Noto+Sans+KR:wght@300;400;700;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet" />
    <style>
        /* ── Reset ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            word-break: keep-all;
            text-rendering: optimizeLegibility;
        }

        /* ── Slide Container ── */
        .deck { display: flex; }

        .slide {
            width: 100vw;
            min-width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5vh 10vw;
            position: relative;
            overflow: hidden;
            background: #0D0D0D;
            box-sizing: border-box;
        }

        .slide > * { position: relative; z-index: 1; }

        /* ── Section Themes (color accent for divider slides) ── */
        .slide.samsung { background: linear-gradient(135deg, #0A1060 0%, #1428A0 55%, #1A7AFC 100%); }
        .slide.blue { background: #1428A0; }
        .slide.navy { background: #0D1B5E; }
        .slide.indigo { background: #2D1FA8; }
        .slide.violet { background: #5B1FA8; }
        .slide.rose { background: #A8194A; }
        .slide.mint { background: #0A7A56; }
        .slide.teal { background: #0A6E62; }
        .slide.cyan { background: #0A5E82; }
        .slide.amber { background: #A05C00; }
        .slide.orange { background: #C04800; }

        /* Section .eyebrow / .hero-sub brightness */
        .slide.samsung .eyebrow, .slide.blue .eyebrow, .slide.navy .eyebrow,
        .slide.indigo .eyebrow, .slide.violet .eyebrow, .slide.rose .eyebrow,
        .slide.mint .eyebrow, .slide.teal .eyebrow, .slide.cyan .eyebrow,
        .slide.amber .eyebrow, .slide.orange .eyebrow { color: rgba(255,255,255,0.55); }

        .slide.samsung .hero-sub, .slide.blue .hero-sub, .slide.navy .hero-sub,
        .slide.indigo .hero-sub, .slide.violet .hero-sub, .slide.rose .hero-sub,
        .slide.mint .hero-sub, .slide.teal .hero-sub, .slide.cyan .hero-sub,
        .slide.amber .hero-sub, .slide.orange .hero-sub { color: rgba(255,255,255,0.75); }

        /* Section .accent overrides */
        .slide.blue .accent, .slide.navy .accent, .slide.samsung .accent { color: #7AB8FF; }
        .slide.indigo .accent { color: #A5B4FC; }
        .slide.violet .accent { color: #C4B5FD; }
        .slide.rose .accent { color: #FDA4AF; }
        .slide.mint .accent { color: #4EEDB4; }
        .slide.teal .accent { color: #4EEAB8; }
        .slide.cyan .accent { color: #38E8F8; }
        .slide.amber .accent { color: #FBCF60; }
        .slide.orange .accent { color: #FBCF80; }

        /* ── In-Section Content Themes (dark tinted backgrounds) ── */
        .slide.in-blue { background: #0E1228; }
        .slide.in-blue .accent { color: #7AB8FF; }
        .slide.in-navy { background: #0A0E28; }
        .slide.in-navy .accent { color: #7AB8FF; }
        .slide.in-indigo { background: #0F1030; }
        .slide.in-indigo .accent { color: #A5B4FC; }
        .slide.in-violet { background: #130D28; }
        .slide.in-violet .accent { color: #C4B5FD; }
        .slide.in-rose { background: #1A0A14; }
        .slide.in-rose .accent { color: #FDA4AF; }
        .slide.in-mint { background: #081A14; }
        .slide.in-mint .accent { color: #4EEDB4; }
        .slide.in-teal { background: #081418; }
        .slide.in-teal .accent { color: #4EEAB8; }
        .slide.in-cyan { background: #081420; }
        .slide.in-cyan .accent { color: #38E8F8; }
        .slide.in-amber { background: #1A1000; }
        .slide.in-amber .accent { color: #FBCF60; }
        .slide.in-orange { background: #1A0E00; }
        .slide.in-orange .accent { color: #FBCF80; }

        /* ── Typography ── */
        .eyebrow {
            font-size: clamp(0.85rem, 1.1vw, 1.05rem);
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 3vh;
        }

        .hero {
            font-family: 'Figtree', 'Noto Sans KR', sans-serif;
            font-size: clamp(3rem, 5vw, 5rem);
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -0.03em;
            text-align: center;
            color: #fff;
        }

        .hero-sub {
            font-size: clamp(1.25rem, 1.8vw, 1.8rem);
            font-weight: 300;
            color: rgba(255,255,255,0.5);
            margin-top: 2vh;
            text-align: center;
            letter-spacing: -0.01em;
            line-height: 1.5;
        }

        .hero-sub strong { color: #fff; font-weight: 700; }

        .accent { color: #60a5fa; }
        .red { color: #FCA5A5; }
        .green { color: #86efac; }
        .yellow { color: #F2D7A1; }

        h2.hero { font-size: clamp(1.8rem, 3vw, 2.8rem); }

        h3 {
            font-family: 'Figtree', 'Noto Sans KR', sans-serif;
            font-size: clamp(1.3rem, 1.6vw, 1.5rem);
            font-weight: 700;
            color: #fff;
            text-align: center;
            letter-spacing: -0.01em;
        }

        /* ── Decorative Line ── */
        .line {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.18);
            margin: 2vh auto;
        }

        /* ── Big Number ── */
        .bignum {
            font-family: 'Figtree', sans-serif;
            font-size: clamp(6rem, 12vw, 11rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            color: #fff;
            text-align: center;
        }
        .bignum-label {
            font-size: clamp(1rem, 1.3vw, 1.25rem);
            font-weight: 300;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
            margin-top: 1.5vh;
        }

        /* ── Pillars (text columns with thin separators) ── */
        .pillars {
            display: flex;
            gap: 0;
            width: 100%;
            max-width: 960px;
            margin-top: 3vh;
        }
        .pillar {
            flex: 1;
            text-align: center;
            padding: 0 3vw;
            border-right: 1px solid rgba(255,255,255,0.08);
        }
        .pillar:last-child { border-right: none; }
        .pillar-icon {
            font-size: 2rem;
            margin-bottom: 2vh;
            opacity: 0.7;
        }
        .pillar-title {
            font-size: clamp(1.1rem, 1.4vw, 1.35rem);
            font-weight: 700;
            color: #fff;
            margin-bottom: 1vh;
        }
        .pillar-desc {
            font-size: clamp(0.9rem, 1.1vw, 1.05rem);
            font-weight: 300;
            color: rgba(255,255,255,0.45);
            line-height: 1.7;
        }

        /* ── Comparison (before / after) ── */
        .compare {
            display: flex;
            align-items: center;
            gap: 4vw;
            margin-top: 3vh;
            width: 100%;
            max-width: 900px;
        }
        .compare-side { flex: 1; text-align: center; }
        .compare-year {
            font-size: clamp(0.7rem, 0.9vw, 0.85rem);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            margin-bottom: 1.2vh;
        }
        .compare-num {
            font-family: 'Figtree', sans-serif;
            font-size: clamp(2.6rem, 4.2vw, 4.2rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1;
        }
        .compare-num.muted { color: rgba(255,255,255,0.22); }
        .compare-num.bright { color: #fff; }
        .compare-detail {
            font-size: clamp(0.9rem, 1.1vw, 1.05rem);
            color: rgba(255,255,255,0.4);
            line-height: 1.7;
            margin-top: 1.5vh;
        }
        .compare-arrow {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.15);
            flex-shrink: 0;
        }

        /* ── Stat Row ── */
        .stat-row {
            display: flex;
            gap: 0;
            width: 100%;
            max-width: 800px;
            margin-top: 3vh;
        }
        .stat-cell {
            flex: 1;
            text-align: center;
            padding: 0 2vw;
            border-right: 1px solid rgba(255,255,255,0.08);
        }
        .stat-cell:last-child { border-right: none; }
        .stat-num {
            font-family: 'Figtree', sans-serif;
            font-size: clamp(3.5rem, 6vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #fff;
            line-height: 1;
        }
        .stat-desc {
            font-size: clamp(0.85rem, 1.1vw, 1rem);
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 1.2vh;
            line-height: 1.5;
        }

        /* ── Accent Card (highlighted box) ── */
        .accent-card {
            background: rgba(96,165,250,0.08);
            border: 1px solid rgba(96,165,250,0.3);
            border-radius: 16px;
            padding: 3vh 2vw;
            text-align: center;
        }
        .accent-card .card-num {
            font-family: 'Figtree', sans-serif;
            font-size: clamp(2.8rem, 4.5vw, 4rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            color: #fff;
            line-height: 1;
        }
        .accent-card .card-label {
            font-size: clamp(1.1rem, 1.4vw, 1.3rem);
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 1.5vh;
            line-height: 1.4;
        }

        /* ── Flow (horizontal process) ── */
        .flow {
            display: flex;
            align-items: center;
            gap: 1.5vw;
            margin-top: 3vh;
        }
        .flow-step {
            font-size: clamp(1.1rem, 1.5vw, 1.3rem);
            color: rgba(255,255,255,0.5);
        }
        .flow-step.active { color: #fff; font-weight: 700; }
        .flow-arrow { color: rgba(255,255,255,0.2); }

        /* ── Keyword Pill ── */
        .pill {
            display: inline-flex;
            align-items: center;
            padding: 0.8em 1.6em;
            border: 1px solid rgba(96,165,250,0.35);
            background: rgba(96,165,250,0.08);
            border-radius: 12px;
            font-size: clamp(1.1rem, 1.5vw, 1.35rem);
            color: rgba(255,255,255,0.75);
            letter-spacing: 0.05em;
            font-weight: 500;
            margin: 0.6vh 0.6vw;
        }

        /* ── Video / Media Placeholder ── */
        .vid-box {
            width: 100%;
            max-width: 760px;
            aspect-ratio: 16/9;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 4vh;
            background: rgba(255,255,255,0.025);
        }
        .vid-box svg { opacity: 0.2; }
        .vid-box span {
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
        }

        /* ── Code Block ── */
        .code {
            background: #080808;
            border: 1px solid rgba(255,255,255,0.06);
            padding: 1.5vh 2vw;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: clamp(0.82rem, 0.95vw, 0.92rem);
            line-height: 1.6;
            max-width: 720px;
            width: 100%;
            margin: 1.5vh auto;
            white-space: pre;
            color: rgba(255,255,255,0.75);
            text-align: left;
            max-height: 55vh;
            overflow-x: auto;
            overflow-y: auto;
        }
        .code .comment { color: rgba(255,255,255,0.25); }
        .code .keyword { color: #c4b5fd; }
        .code .string { color: #86efac; }

        /* ── Quote ── */
        blockquote {
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            font-weight: 300;
            max-width: 780px;
            text-align: center;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            letter-spacing: -0.01em;
        }
        cite {
            display: block;
            margin-top: 24px;
            font-size: 0.82rem;
            color: rgba(255,255,255,0.25);
            font-style: normal;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── Table ── */
        .tbl { margin-top: 1.5vh; border-collapse: collapse; max-width: 82vw; }
        .tbl th, .tbl td { padding: 1vh 2vw; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tbl th { color: rgba(255,255,255,0.3); font-weight: 500; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; }
        .tbl td { font-size: clamp(0.95rem, 1.15vw, 1.1rem); color: rgba(255,255,255,0.65); }

        /* ── List ── */
        .list { list-style: none; max-width: 80vw; width: 100%; margin: 0 auto; }
        .list li { font-size: clamp(1.1rem, 1.5vw, 1.35rem); padding: 1.4vh 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.55); font-weight: 300; line-height: 1.35; text-align: center; }
        .list li:last-child { border-bottom: none; }
        .list strong { color: #fff; font-weight: 700; }

        /* ── Bottom Caption ── */
        .caption {
            position: absolute;
            bottom: 5vh;
            left: 0; right: 0;
            text-align: center;
            font-size: clamp(0.85rem, 1.1vw, 1rem);
            color: rgba(255,255,255,0.28);
            font-weight: 300;
            letter-spacing: 0.04em;
            z-index: 2;
        }

        /* ── Navigation ── */
        .nav {
            position: fixed;
            bottom: 28px;
            left: 44px;
            display: flex;
            gap: 6px;
            z-index: 100;
        }
        .nav button {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.45);
            font-size: 14px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.18s;
        }
        .nav button:hover { background: rgba(255,255,255,0.14); color: #fff; }

        .page-num {
            position: fixed;
            bottom: 32px; right: 44px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            font-family: 'Figtree', sans-serif;
            z-index: 100;
        }

        .progress {
            position: fixed;
            top: 0; left: 0;
            height: 1px;
            background: rgba(255,255,255,0.3);
            z-index: 200;
            transition: none;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .slide { padding: 6vh 6vw 80px; }
            .pillars, .compare, .stat-row { flex-direction: column; gap: 5vh; }
            .pillar { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 3vh; }
            .pillar:last-child { border-bottom: none; }
            .stat-cell { border-right: none; padding: 2vh 0; }
            .flow { flex-wrap: wrap; justify-content: center; }
        }

        /* ── Print ── */
        @media print {
            body { background: #fff; color: #000; overflow: visible; }
            .nav, .progress, .page-num { display: none; }
            .deck { display: block; }
            .slide { min-height: auto; page-break-after: always; background: #fff !important; color: #000 !important; padding: 2cm; height: auto; }
            .slide.samsung, .slide.blue, .slide.navy, .slide.indigo, .slide.violet,
            .slide.rose, .slide.mint, .slide.teal, .slide.cyan, .slide.amber, .slide.orange { color: #000 !important; }
            .hero, .bignum, .stat-num, .compare-num, .pillar-title, h3 { color: #000 !important; }
            .hero-sub, .eyebrow, .pillar-desc, .compare-detail, .stat-desc, .bignum-label { color: #333 !important; }
            .accent, .red, .green, .yellow { color: #000 !important; }
        }

        /* ── Accessibility ── */
        @media (prefers-reduced-motion: reduce) { .nav button { transition: none; } }
        .nav button:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        .slide:focus-visible { outline: none; }
    </style>
</head>
<body>

    <div class="progress" id="progress"></div>
    <div class="deck" id="deck">

        <!-- ═══════════════ SLIDES GO HERE ═══════════════ -->

        <!-- Example: Cover Slide -->
        <div class="slide">
            <h1 class="hero">Presentation Title</h1>
            <div class="line"></div>
            <p class="hero-sub">Subtitle or tagline</p>
            <p class="eyebrow" style="margin-top:3vh; margin-bottom:0;">Author · Department · Date</p>
        </div>

        <!-- Example: Section Divider -->
        <div class="slide">
            <p class="eyebrow">Section 01</p>
            <h1 class="hero">Section Title</h1>
        </div>

        <!-- Example: Content Slide -->
        <div class="slide">
            <p class="eyebrow">Topic</p>
            <h2 class="hero">Content <span class="accent">Heading</span></h2>
            <div class="line"></div>
            <p class="hero-sub">Supporting description</p>
        </div>

        <!-- Example: Closing Slide -->
        <div class="slide">
            <h1 class="hero">Thank You</h1>
            <div class="line"></div>
            <p class="hero-sub">Q &amp; A</p>
        </div>

        <!-- ═══════════════ END SLIDES ═══════════════ -->

    </div>
    <nav aria-label="Slide navigation" class="nav">
        <button aria-label="Previous slide" onclick="prev()">&#8592;</button>
        <button aria-label="Next slide" onclick="next()">&#8594;</button>
    </nav>
    <div class="page-num" id="pageNum"></div>
    <script>
        const slides = document.querySelectorAll('.slide');
        const total = slides.length;
        let cur = 0;

        const pageEl = document.getElementById('pageNum');
        const progEl = document.getElementById('progress');

        function update() {
            pageEl.textContent = (cur + 1) + ' / ' + total;
            progEl.style.width = total > 1 ? ((cur / (total - 1)) * 100) + '%' : '100%';
        }

        function goTo(i) {
            if (i < 0) i = 0;
            if (i >= total) i = total - 1;
            cur = i;
            document.getElementById('deck').style.transform = 'translateX(-' + (cur * 100) + 'vw)';
            try { history.replaceState(null, '', '#' + (cur + 1)); } catch(e) {}
            update();
        }

        function next() { goTo(cur + 1); }
        function prev() { goTo(cur - 1); }

        document.addEventListener('keydown', e => {
            const tag = document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); next(); }
            else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
            else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
            else if (e.key === 'End') { e.preventDefault(); goTo(total - 1); }
            else if (e.key === 'f' || e.key === 'F') {
                const el = document.documentElement;
                if (!document.fullscreenElement) el.requestFullscreen?.().catch(() => {});
                else document.exitFullscreen?.().catch(() => {});
            }
        });

        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', e => {
            const dx = tx - e.changedTouches[0].clientX;
            const dy = ty - e.changedTouches[0].clientY;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) dx > 0 ? next() : prev();
        }, { passive: true });

        const init = parseInt(location.hash.slice(1)) - 1;
        if (!isNaN(init) && init >= 0) goTo(init); else update();
    </script>
</body>
</html>
